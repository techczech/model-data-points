<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
<title id="title">Weekly API-equivalent value in full-record windows</title>
<desc id="desc">Top: three consecutive full weeks for both tools, stacked by tool. Bottom: eight full weeks for Claude Code only. Each panel is independently ranked by value, descending, with no time axis. Orange is Codex priced value and blue is Claude Code. Earlier fragmentary weeks, missing records and the current partial week are excluded. Exact ranked values are in the weekly CSV.</desc>
<rect width="900" height="620" fill="white"/>
<g font-family="sans-serif" font-size="12" fill="#172b40">
<g data-window="headline">
<text x="78" y="22" font-size="15" font-weight="bold">Both tools: three consecutive full weeks (ranked by value)</text>
<text x="78" y="42">Standard short-context API value (USD); unpriced tokens excluded</text>
<path d="M78 240.0H880" stroke="#d9e0e7"/>
<text x="70" y="244.0" text-anchor="end">$0</text>
<path d="M78 195.0H880" stroke="#d9e0e7"/>
<text x="70" y="199.0" text-anchor="end">$1,234</text>
<path d="M78 150.0H880" stroke="#d9e0e7"/>
<text x="70" y="154.0" text-anchor="end">$2,467</text>
<path d="M78 105.0H880" stroke="#d9e0e7"/>
<text x="70" y="109.0" text-anchor="end">$3,701</text>
<path d="M78 60.0H880" stroke="#d9e0e7"/>
<text x="70" y="64.0" text-anchor="end">$4,935</text>
